<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Rifa Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #9b59b6 0%, #6c3483 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    h1, h2, h3 { color: #4a235a; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d2b4de;
      border-radius: 30px;
      font-size: 14px;
    }
    button {
      background: #8e44ad;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #6c3483; transform: scale(1.02); }
    .btn-danger { background: #c0392b; }
    .btn-danger:hover { background: #a82313; }
    .btn-success { background: #27ae60; }
    .btn-success:hover { background: #1e8449; }
    .mensagem {
      padding: 12px;
      border-radius: 30px;
      margin: 10px 0;
      display: none;
    }
    .mensagem.sucesso { background: #d5f5e3; color: #1e8449; display: block; }
    .mensagem.erro { background: #fadbd8; color: #c0392b; display: block; }
    .login-box { max-width: 450px; margin: 80px auto; text-align: center; }
    .grid-numeros {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .numero-item {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-weight: bold;
    }
    .numero-livre { background: #d2b4de; color: #4a235a; }
    .numero-vendido { background: #4a235a; color: #f5eef8; }
    .info { background: #f4ecf7; padding: 15px; border-radius: 20px; margin: 15px 0; }
  </style>
</head>
<body>
<div class="container">
  <div id="telaLogin" class="card login-box">
    <h1>🔐 Login Admin - Rifa Online</h1>
    <input type="text" id="loginUsername" placeholder="Usuário">
    <input type="password" id="loginPassword" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
    <div id="loginMensagem" class="mensagem"></div>
  </div>

  <div id="painelAdmin" style="display: none;">
    <div class="card">
      <div style="display: flex; justify-content: space-between;">
        <h1>👑 Painel Admin - Rifa Online</h1>
        <button id="btnLogout" class="btn-danger">Sair</button>
      </div>
      <div id="usuarioInfo" class="info"></div>
    </div>

    <div class="card">
      <h2>➕ Vender número (1 a 1000)</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="number" id="venderNumero" placeholder="Número">
        <input type="text" id="venderNome" placeholder="Nome completo">
        <button id="btnVender">Vender</button>
      </div>
      <div id="venderMensagem" class="mensagem"></div>
      <h2>📊 Números da rifa</h2>
      <div id="listaNumeros" class="grid-numeros"></div>
    </div>

    <div class="card">
      <h2>⚙️ Configurações</h2>
      <input type="text" id="configTitulo" placeholder="Título" value="Rifa Online">
      <input type="text" id="configChavePix" placeholder="Chave PIX">
      <textarea id="configTexto" rows="3" placeholder="Texto explicativo"></textarea>
      <input type="datetime-local" id="configDataSorteio">
      <input type="text" id="configWhatsapp" placeholder="Texto do WhatsApp">
      <button id="btnSalvarConfig">💾 Salvar</button>
      <div id="configMensagem" class="mensagem"></div>
    </div>

    <div class="card">
      <h2>🖼️ Foto do brinde</h2>
      <input type="file" id="fotoArquivo" accept="image/*">
      <button id="btnEnviarFoto">📤 Enviar</button>
      <div id="fotoPreview"></div>
      <div id="fotoMensagem" class="mensagem"></div>
    </div>

    <div class="card">
      <h2>🏆 Definir ganhador</h2>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="number" id="ganhadorNumero" placeholder="Número">
        <input type="text" id="ganhadorNome" placeholder="Nome">
        <button id="btnDefinirGanhador" class="btn-success">Definir</button>
      </div>
      <div id="ganhadorMensagem" class="mensagem"></div>
    </div>

    <div class="card">
      <h2>🔒 Controle</h2>
      <button id="btnEncerrar" class="btn-danger">Encerrar rifa</button>
      <button id="btnReabrir">Reabrir rifa</button>
      <button id="btnPDF" class="btn-success">Gerar PDF</button>
    </div>

    <div class="card">
      <h2>📝 Últimos logs</h2>
      <div id="logsLista" style="max-height: 250px; overflow-y: auto; font-size: 13px;"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wrofweogvhgkocevlvdf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Z3ZW9ndmhna29jZXZsdmRmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgwMzgxOSwiZXhwIjoyMDk0Mzc5ODE5fQ.-SJeuoVOHkuFH2UVs4GWsY0UNWYiWsSB211zKx5pmy0';

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json'
  };

  async function fetchSupabase(endpoint, options = {}) {
    const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
    const res = await fetch(url, { ...options, headers });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  let usuarioLogado = null;

  function mostrarMensagem(elId, texto, tipo) {
    const div = document.getElementById(elId);
    if (!div) return;
    div.textContent = texto;
    div.className = `mensagem ${tipo}`;
    setTimeout(() => { div.className = 'mensagem'; div.textContent = ''; }, 3000);
  }

  async function fazerLogin(username, password) {
    const data = await fetchSupabase(`usuarios_admin?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}`);
    if (!data || data.length === 0) throw new Error('Usuário ou senha inválidos');
    return data[0];
  }

  async function registrarLog(acao) {
    if (!usuarioLogado) return;
    await fetchSupabase('logs', {
      method: 'POST',
      body: JSON.stringify({ acao, usuario: usuarioLogado.username, data_hora: new Date() })
    }).catch(e => console.error);
  }

  async function carregarLogs() {
    try {
      const data = await fetchSupabase('logs?order=data_hora.desc&limit=15');
      const logsDiv = document.getElementById('logsLista');
      if (data && data.length) {
        logsDiv.innerHTML = data.map(l => `📌 ${new Date(l.data_hora).toLocaleString()} - ${l.acao} (${l.usuario})`).join('<br>');
      } else logsDiv.innerHTML = 'Nenhum log.';
    } catch(e) { console.error(e); }
  }

  async function carregarNumeros() {
    try {
      const data = await fetchSupabase('numeros?order=numero.asc');
      const grid = document.getElementById('listaNumeros');
      if (data) {
        grid.innerHTML = data.map(num => `
          <div class="numero-item ${num.nome_comprador ? 'numero-vendido' : 'numero-livre'}"
               title="${num.nome_comprador ? `Vendido: ${num.nome_comprador}` : 'Livre'}">
            ${num.numero}
          </div>
        `).join('');
      }
    } catch(e) { console.error(e); }
  }

  async function carregarConfig() {
    try {
      const data = await fetchSupabase('config?id=eq.1');
      if (data && data[0]) {
        const c = data[0];
        document.getElementById('configTitulo').value = c.titulo || 'Rifa Online';
        document.getElementById('configChavePix').value = c.chave_pix || '';
        document.getElementById('configTexto').value = c.texto_explicativo || '';
        document.getElementById('configWhatsapp').value = c.texto_compartilhamento || '';
        if (c.data_sorteio) document.getElementById('configDataSorteio').value = c.data_sorteio.slice(0,16);
        if (c.foto_url) document.getElementById('fotoPreview').innerHTML = `<img src="${c.foto_url}" style="max-width:150px; border-radius:20px;">`;
      }
    } catch(e) { console.error(e); }
  }

  // Eventos
  document.getElementById('btnLogin').onclick = async () => {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    try {
      const user = await fazerLogin(username, password);
      usuarioLogado = user;
      document.getElementById('telaLogin').style.display = 'none';
      document.getElementById('painelAdmin').style.display = 'block';
      document.getElementById('usuarioInfo').innerHTML = `✅ Logado: ${user.nome || user.username}`;
      await registrarLog('Login');
      await carregarNumeros();
      await carregarConfig();
      await carregarLogs();
    } catch(e) {
      mostrarMensagem('loginMensagem', e.message, 'erro');
    }
  };

  document.getElementById('btnLogout').onclick = async () => {
    await registrarLog('Logout');
    usuarioLogado = null;
    document.getElementById('telaLogin').style.display = 'block';
    document.getElementById('painelAdmin').style.display = 'none';
  };

  document.getElementById('btnVender').onclick = async () => {
    const numero = parseInt(document.getElementById('venderNumero').value);
    const nome = document.getElementById('venderNome').value.trim();
    if (!numero || !nome) { mostrarMensagem('venderMensagem', 'Preencha número e nome', 'erro'); return; }
    if (numero < 1 || numero > 1000) { mostrarMensagem('venderMensagem', 'Número inválido (1-1000)', 'erro'); return; }
    try {
      const verif = await fetchSupabase(`numeros?numero=eq.${numero}&select=nome_comprador`);
      if (verif[0]?.nome_comprador) throw new Error(`Número ${numero} já vendido!`);
      await fetchSupabase(`numeros?numero=eq.${numero}`, { method: 'PATCH', body: JSON.stringify({ nome_comprador: nome, data_compra: new Date() }) });
      mostrarMensagem('venderMensagem', `✅ Número ${numero} vendido para ${nome}`, 'sucesso');
      document.getElementById('venderNumero').value = '';
      document.getElementById('venderNome').value = '';
      await registrarLog(`Vendeu ${numero} para ${nome}`);
      await carregarNumeros();
      await carregarLogs();
    } catch(e) { mostrarMensagem('venderMensagem', e.message, 'erro'); }
  };

  document.getElementById('btnSalvarConfig').onclick = async () => {
    const titulo = document.getElementById('configTitulo').value;
    const chave = document.getElementById('configChavePix').value;
    const texto = document.getElementById('configTexto').value;
    const dataSorteio = document.getElementById('configDataSorteio').value;
    const whats = document.getElementById('configWhatsapp').value;
    try {
      await fetchSupabase('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ titulo, chave_pix: chave, texto_explicativo: texto, data_sorteio: dataSorteio || null, texto_compartilhamento: whats }) });
      mostrarMensagem('configMensagem', '✅ Configurações salvas', 'sucesso');
      await registrarLog('Salvou configurações');
    } catch(e) { mostrarMensagem('configMensagem', 'Erro ao salvar', 'erro'); }
  };

  document.getElementById('btnEnviarFoto').onclick = async () => {
    const file = document.getElementById('fotoArquivo').files[0];
    if (!file) return mostrarMensagem('fotoMensagem', 'Selecione uma foto', 'erro');
    try {
      const fileName = `${Date.now()}_${file.name}`;
      const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/brindes/${fileName}`, {
        method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }, body: file
      });
      if (!uploadRes.ok) throw new Error();
      const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/brindes/${fileName}`;
      await fetchSupabase('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ foto_url: publicUrl }) });
      mostrarMensagem('fotoMensagem', '✅ Foto enviada', 'sucesso');
      document.getElementById('fotoPreview').innerHTML = `<img src="${publicUrl}" style="max-width:150px; border-radius:20px;">`;
      await registrarLog('Enviou foto do brinde');
    } catch(e) { mostrarMensagem('fotoMensagem', 'Erro no upload', 'erro'); }
  };

  document.getElementById('btnDefinirGanhador').onclick = async () => {
    const num = parseInt(document.getElementById('ganhadorNumero').value);
    const nome = document.getElementById('ganhadorNome').value.trim();
    if (!num || !nome) return mostrarMensagem('ganhadorMensagem', 'Preencha número e nome', 'erro');
    if (confirm(`Definir ${nome} como ganhador do número ${num}?`)) {
      await fetchSupabase('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ ganhador_nome: nome, ganhador_numero: num, rifa_encerrada: true }) });
      mostrarMensagem('ganhadorMensagem', `✅ Ganhador: ${nome} (nº ${num})`, 'sucesso');
      await registrarLog(`Ganhador: ${nome} nº ${num}`);
    }
  };

  document.getElementById('btnEncerrar').onclick = async () => {
    if (confirm('Encerrar a rifa?')) {
      await fetchSupabase('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ rifa_encerrada: true }) });
      await registrarLog('Encerrou rifa');
      alert('Rifa encerrada');
    }
  };
  document.getElementById('btnReabrir').onclick = async () => {
    if (confirm('Reabrir?')) {
      await fetchSupabase('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ rifa_encerrada: false, ganhador_nome: null, ganhador_numero: null }) });
      await registrarLog('Reabriu rifa');
      alert('Rifa reaberta');
    }
  };
  document.getElementById('btnPDF').onclick = async () => {
    const data = await fetchSupabase('numeros?not=null.nome_comprador&select=numero,nome_comprador');
    if (!data.length) { alert('Nenhum comprador'); return; }
    let html = '<html><head><meta charset="UTF-8"><title>Compradores</title></head><body><h1>Lista de compradores</h1><ul>';
    data.forEach(c => html += `<li>Número ${c.numero} - ${c.nome_comprador}</li>`);
    html += '</ul></body></html>';
    const win = window.open(); win.document.write(html); win.document.close(); win.print();
    await registrarLog('Gerou PDF');
  };
</script>
</body>
</html>
