<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin Simples - Rifa</title>
  <style>
    body { font-family: Arial; background: #9b59b6; padding: 20px; }
    .container { max-width: 1000px; margin: auto; background: white; border-radius: 20px; padding: 20px; }
    .numeros-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .numero { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-weight: bold; cursor: pointer; }
    .livre { background: #d2b4de; color: #4a235a; }
    .vendido { background: #4a235a; color: white; cursor: not-allowed; }
    .selecionado { background: #f1c40f; color: black; }
    button { background: #8e44ad; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin: 5px; }
    input { padding: 10px; margin: 10px 0; width: 100%; }
  </style>
</head>
<body>
<div class="container">
  <h1>Admin Rifa</h1>
  <div>
    <label>Total de números: </label>
    <input type="number" id="totalNumeros" value="10" min="1" max="1000">
    <button id="btnAtualizar">Atualizar números</button>
  </div>
  <div>
    <input type="text" id="nomeComprador" placeholder="Nome do comprador">
    <button id="btnVender">Vender selecionados</button>
    <button id="btnLimpar">Limpar seleção</button>
  </div>
  <div id="numerosGrid" class="numeros-grid"></div>
  <div id="mensagem"></div>
  <p><a href="index.html">← Voltar</a></p>
</div>

<script>
  const SUPABASE_URL = 'https://wrofweogvhgkocevlvdf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Z3ZW9ndmhna29jZXZsdmRmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgwMzgxOSwiZXhwIjoyMDk0Mzc5ODE5fQ.-SJeuoVOHkuFH2UVs4GWsY0UNWYiWsSB211zKx5pmy0';
  const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

  let numerosAtuais = [];
  let selecionados = new Set();

  async function fetchAPI(endpoint, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, { ...options, headers });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function carregarNumeros() {
    const data = await fetchAPI('numeros?order=numero.asc');
    numerosAtuais = data;
    renderizar();
  }

  function renderizar() {
    const grid = document.getElementById('numerosGrid');
    grid.innerHTML = '';
    for (let num of numerosAtuais) {
      const div = document.createElement('div');
      div.className = 'numero';
      if (num.nome_comprador) {
        div.classList.add('vendido');
        div.title = `Vendido: ${num.nome_comprador}`;
      } else if (selecionados.has(num.numero)) {
        div.classList.add('selecionado');
      } else {
        div.classList.add('livre');
      }
      div.textContent = num.numero;
      if (!num.nome_comprador) {
        div.onclick = () => {
          if (selecionados.has(num.numero)) selecionados.delete(num.numero);
          else selecionados.add(num.numero);
          renderizar();
        };
      }
      grid.appendChild(div);
    }
  }

  async function atualizarTotal(novoTotal) {
    const existentes = numerosAtuais.map(n => n.numero);
    // Adicionar números faltantes
    for (let i = 1; i <= novoTotal; i++) {
      if (!existentes.includes(i)) {
        await fetchAPI('numeros', { method: 'POST', body: JSON.stringify({ numero: i, nome_comprador: null }) });
      }
    }
    // Remover números acima do novoTotal (somente se não vendidos)
    for (let num of numerosAtuais) {
      if (num.numero > novoTotal && !num.nome_comprador) {
        await fetchAPI(`numeros?numero=eq.${num.numero}`, { method: 'DELETE' });
      }
    }
    // Atualizar config.total_numeros
    await fetchAPI('config?id=eq.1', { method: 'PATCH', body: JSON.stringify({ total_numeros: novoTotal }) });
    await carregarNumeros();
    document.getElementById('mensagem').innerText = `Total atualizado para ${novoTotal} números.`;
    setTimeout(() => document.getElementById('mensagem').innerText = '', 3000);
  }

  async function venderSelecionados() {
    const nome = document.getElementById('nomeComprador').value.trim();
    if (!nome) { alert('Digite o nome do comprador'); return; }
    const nums = Array.from(selecionados);
    if (nums.length === 0) { alert('Selecione ao menos um número'); return; }
    for (let num of nums) {
      await fetchAPI(`numeros?numero=eq.${num}`, { method: 'PATCH', body: JSON.stringify({ nome_comprador: nome, data_compra: new Date() }) });
    }
    selecionados.clear();
    await carregarNumeros();
    document.getElementById('mensagem').innerText = `${nums.length} números vendidos para ${nome}.`;
    setTimeout(() => document.getElementById('mensagem').innerText = '', 3000);
  }

  document.getElementById('btnAtualizar').onclick = async () => {
    const total = parseInt(document.getElementById('totalNumeros').value);
    if (total >= 1 && total <= 1000) await atualizarTotal(total);
    else alert('Total inválido');
  };
  document.getElementById('btnVender').onclick = venderSelecionados;
  document.getElementById('btnLimpar').onclick = () => { selecionados.clear(); renderizar(); };

  carregarNumeros();
</script>
</body>
</html>
