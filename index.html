<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rifa da Empresa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 10px; }
    #app { max-width: 400px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 22px; color: #333; }
    #foto-brinde { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
    #texto-explicativo { font-size: 14px; color: #666; margin: 10px 0; }
    #contador { font-size: 16px; color: #d32f2f; font-weight: bold; margin: 10px 0; }
    
    #grid-numeros {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 15px 0;
    }
    .numero {
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #ccc;
      cursor: pointer;
      min-height: 44px;
      background: #fff;
      font-size: 14px;
    }
    .numero.disponivel { background: #4caf50; color: white; border-color: #388e3c; }
    .numero.ocupado { background: #ddd; color: #666; border-color: #999; text-decoration: line-through; }
    
    .chave-pix { background: #fff; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center; }
    .chave-pix button { background: #2196f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; }
    
    .flutuante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2196f3;
      color: white;
      border: none;
      font-size: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .hidden { display: none !important; }
    input, button, textarea { display: block; width: 100%; margin-top: 8px; padding: 10px; font-size: 16px; }
    .btn-confirm { background: #4caf50; color: white; border: none; }
    .btn-cancel { background: #f44336; color: white; border: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Cabeçalho -->
    <header>
      <h1 id="titulo">Rifa da Empresa</h1>
      <p id="texto-explicativo"></p>
      <div id="contador"></div>
      <img id="foto-brinde" src="" alt="Foto do brinde" style="display:none;" />
    </header>

    <!-- Chave PIX -->
    <div class="chave-pix" id="chave-pix-area" style="display:none;">
      <strong>Chave PIX:</strong> <span id="chave-pix-texto"></span>
      <button id="btn-copiar-chave">Copiar chave</button>
    </div>

    <!-- Grid de números -->
    <div id="grid-numeros"></div>

    <!-- Meus números -->
    <div style="margin: 15px 0;">
      <input type="text" id="busca-nome" placeholder="Digite seu nome para ver seus números" />
      <button id="btn-buscar-numeros">Buscar meus números</button>
      <div id="resultado-busca"></div>
    </div>

    <!-- Botão admin -->
    <button id="btn-admin" class="flutuante">⚙️</button>

    <!-- Modal Admin -->
    <div id="modal-admin" class="modal hidden">
      <div class="modal-content">
        <h2>Painel Administrativo</h2>
        <input type="text" id="admin-email" placeholder="E-mail" />
        <input type="password" id="admin-senha" placeholder="Senha" />
        <button id="btn-login">Entrar</button>
        <div id="area-admin" class="hidden">
          <hr />
          <h3>Adicionar comprador</h3>
          <input type="number" id="numero-input" placeholder="Número" />
          <input type="text" id="nome-input" placeholder="Nome do comprador" />
          <button id="btn-adicionar">Adicionar</button>

          <hr />
          <h3>Configurações</h3>
          <label>Total de números:</label>
          <input type="number" id="total-numeros-input" />
          <button id="btn-atualizar-total">Atualizar total</button>

          <label>Chave PIX:</label>
          <input type="text" id="chave-pix-input" />
          <button id="btn-salvar-chave">Salvar chave</button>

          <label>Texto explicativo:</label>
          <textarea id="texto-explicativo-input" rows="3"></textarea>
          <button id="btn-salvar-texto">Salvar texto</button>

          <label>Data do sorteio:</label>
          <input type="datetime-local" id="data-sorteio-input" />
          <button id="btn-salvar-data">Salvar data</button>

          <label>Texto de compartilhamento (WhatsApp):</label>
          <textarea id="texto-compartilhamento-input" rows="2"></textarea>
          <button id="btn-salvar-compartilhamento">Salvar</button>

          <hr />
          <h3>Foto do brinde</h3>
          <input type="file" id="foto-input" accept="image/*" />
          <button id="btn-upload-foto">Enviar foto</button>

          <hr />
          <h3>Definir ganhador</h3>
          <input type="number" id="ganhador-numero-input" placeholder="Número sorteado" />
          <input type="text" id="ganhador-nome-input" placeholder="Nome do ganhador" />
          <button id="btn-salvar-ganhador">Salvar ganhador</button>

          <hr />
          <h3>Encerrar rifa</h3>
          <button id="btn-encerrar-rifa">Encerrar rifa</button>

          <hr />
          <h3>Gerar PDF</h3>
          <button id="btn-gerar-pdf">Baixar lista de compradores (PDF)</button>

          <hr />
          <button id="btn-logout">Sair</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
