<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa Azul</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1, h2, h3 { color: #0d47a1; }
    .pix-area, .brinde-area {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      margin: 20px 0;
    }
    button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #0d47a1; }
    .contador {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      background: #bbdefb;
      color: #0d47a1;
      padding: 15px;
      border-radius: 50px;
      margin: 20px 0;
    }
    .numeros-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      max-height: 650px;
      overflow-y: auto;
      padding: 10px;
    }
    .numero {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
    }
    .disponivel { background: #90caf9; color: #0d47a1; }
    .ocupado { background: #1565c0; color: white; cursor: not-allowed; }
    .texto-explicativo {
      background: #e3f2fd;
      padding: 18px;
      border-radius: 20px;
      margin: 20px 0;
      word-wrap: break-word;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 25px;
      max-width: 90%;
      width: 400px;
      text-align: center;
    }
    .ganhador-screen {
      text-align: center;
      background: gold;
      padding: 30px;
      border-radius: 30px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1 id="titulo">💙 Rifa Azul</h1>
  <div class="brinde-area" id="brindeDiv"></div>
  <div class="pix-area" id="pixDiv"></div>
  <div class="contador" id="contadorDiv">⏳ Carregando...</div>
  <div class="texto-explicativo" id="textoDiv"></div>
  <div class="botoes-acao">
    <button id="meusNumerosBtn">🔍 Meus números</button>
    <button id="whatsappBtn">📱 Compartilhar</button>
  </div>
  <div id="numerosSection">
    <h3>🎟️ Números disponíveis (<span id="totalNumerosSpan"></span> disponíveis de <span id="totalConfigSpan"></span>)</h3>
    <div class="numeros-grid" id="numerosGrid"></div>
  </div>
  <div id="ganhadorSection" style="display: none;" class="ganhador-screen"></div>
  <div class="admin-link"><a href="admin.html">👑 Admin</a></div>
  <footer>Atualiza automática • Rifa online</footer>
</div>

<div id="modalBusca" class="modal">
  <div class="modal-content">
    <h3>🔍 Buscar meus números</h3>
    <input type="text" id="buscaNome" placeholder="Digite parte do seu nome">
    <button id="confirmarBusca">Buscar</button>
    <button id="fecharBusca">Fechar</button>
    <div id="resultadoBusca"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wrofweogvhgkocevlvdf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Z3ZW9ndmhna29jZXZsdmRmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgwMzgxOSwiZXhwIjoyMDk0Mzc5ODE5fQ.-SJeuoVOHkuFH2UVs4GWsY0UNWYiWsSB211zKx5pmy0';
  let configAtual = null;
  let numerosAtuais = [];
  let totalNumeros = 1000;

  async function fetchAPI(endpoint) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Range-Unit': 'items', 'Range': '0-999' } });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function carregarConfig() {
    const data = await fetchAPI('config?id=eq.1');
    if (data && data[0]) {
      configAtual = data[0];
      totalNumeros = configAtual.total_numeros || 1000;
      document.getElementById('totalConfigSpan').innerText = totalNumeros;
      // Exibir brinde
      if (configAtual.foto_url) document.getElementById('brindeDiv').innerHTML = `<img src="${configAtual.foto_url}" style="max-width:100%; max-height:250px; border-radius:20px;">`;
      // Exibir PIX
      if (configAtual.chave_pix) {
        document.getElementById('pixDiv').innerHTML = `<h3>💰 Chave PIX</h3><input id="chavePixInput" value="${configAtual.chave_pix}" readonly><button id="copiarPixBtn">Copiar</button>`;
        document.getElementById('copiarPixBtn')?.addEventListener('click', () => { document.getElementById('chavePixInput').select(); document.execCommand('copy'); alert('Copiado!'); });
      }
      document.getElementById('textoDiv').innerHTML = configAtual.texto_explicativo || '';
      document.getElementById('titulo').textContent = configAtual.titulo || '💙 Rifa Azul';
    }
  }

  async function carregarNumeros() {
    const data = await fetchAPI('numeros?order=numero.asc');
    numerosAtuais = (data || []).filter(n => n.numero <= totalNumeros);
    const vendidos = numerosAtuais.filter(n => n.nome_comprador).length;
    document.getElementById('totalNumerosSpan').innerText = totalNumeros - vendidos;
    const grid = document.getElementById('numerosGrid');
    grid.innerHTML = '';
    for (const num of numerosAtuais) {
      const div = document.createElement('div');
      div.className = `numero ${num.nome_comprador ? 'ocupado' : 'disponivel'}`;
      div.textContent = num.numero;
      if (num.nome_comprador) {
        div.title = `Comprador: ${num.nome_comprador}`;
        div.onclick = async () => {
          const vendaData = await fetchAPI(`vendas?order=id.desc&limit=100`);
          const venda = vendaData?.find(v => {
            return fetchAPI(`venda_numeros?select=numero&venda_id=eq.${v.id}`).then(nums => nums.some(n => n.numero === num.numero));
          });
          if (venda) alert(`Número ${num.numero}\nComprador: ${num.nome_comprador}\nCódigo da venda: #${venda.id}\nData: ${new Date(venda.data_venda).toLocaleString()}`);
          else alert(`Número ${num.numero}\nComprador: ${num.nome_comprador}`);
        };
      }
      grid.appendChild(div);
    }
  }

  function atualizarContador() {
    if (!configAtual?.data_sorteio) return;
    const diff = new Date(configAtual.data_sorteio).getTime() - new Date().getTime();
    const contDiv = document.getElementById('contadorDiv');
    if (diff <= 0 && !configAtual.ganhador_nome && !configAtual.rifa_encerrada) {
      contDiv.innerHTML = '⏳ Aguardando registro do ganhador...';
      document.getElementById('numerosSection').style.display = 'none';
      document.getElementById('ganhadorSection').style.display = 'block';
      document.getElementById('ganhadorSection').innerHTML = `<h2>🎁 Sorteio realizado!</h2><div class="brinde-area"><img src="${configAtual.foto_url || ''}" style="max-width:200px"><p>Brinde: ${configAtual.titulo}</p><p>⏳ Aguardando o administrador definir o ganhador...</p></div>`;
    } else if (configAtual.ganhador_nome) {
      contDiv.innerHTML = `🎉 GANHADOR: ${configAtual.ganhador_nome} - Número ${configAtual.ganhador_numero} 🎉`;
      document.getElementById('numerosSection').style.display = 'none';
      document.getElementById('ganhadorSection').style.display = 'block';
      document.getElementById('ganhadorSection').innerHTML = `<h2>🏆 GANHADOR DEFINIDO 🏆</h2><div class="brinde-area"><img src="${configAtual.foto_url || ''}" style="max-width:250px"><p><strong>Brinde:</strong> ${configAtual.titulo}</p><p><strong>Número sorteado:</strong> ${configAtual.ganhador_numero}</p><p><strong>Ganhador:</strong> ${configAtual.ganhador_nome}</p></div>`;
    } else if (!configAtual.rifa_encerrada && diff > 0) {
      const dias = Math.floor(diff / 86400000), horas = Math.floor((diff % 86400000) / 3600000), minutos = Math.floor((diff % 3600000) / 60000), seg = Math.floor((diff % 60000) / 1000);
      contDiv.innerHTML = `⏰ SORTEIO EM:<br>${dias}d ${horas}h ${minutos}m ${seg}s`;
      document.getElementById('numerosSection').style.display = 'block';
      document.getElementById('ganhadorSection').style.display = 'none';
    }
  }

  document.getElementById('meusNumerosBtn').onclick = () => document.getElementById('modalBusca').style.display = 'flex';
  document.getElementById('fecharBusca').onclick = () => { document.getElementById('modalBusca').style.display = 'none'; document.getElementById('resultadoBusca').innerHTML = ''; };
  document.getElementById('confirmarBusca').onclick = async () => {
    const nome = document.getElementById('buscaNome').value.trim();
    if (!nome) return alert('Digite parte do nome');
    const data = await fetchAPI(`numeros?select=numero&nome_comprador=ilike.%25${encodeURIComponent(nome)}%25`);
    const resultadoDiv = document.getElementById('resultadoBusca');
    if (!data.length) resultadoDiv.innerHTML = '❌ Nenhum número encontrado.';
    else resultadoDiv.innerHTML = `✅ Seus números: ${data.map(n => n.numero).sort((a,b)=>a-b).join(', ')}`;
  };
  document.getElementById('whatsappBtn').onclick = () => {
    let texto = configAtual?.texto_compartilhamento || 'Participe da rifa online!';
    texto += `\n\nLink: ${window.location.href}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  async function iniciar() {
    await carregarConfig();
    await carregarNumeros();
    setInterval(async () => { await carregarConfig(); await carregarNumeros(); atualizarContador(); }, 5000);
  }
  iniciar();
</script>
</body>
</html>
