<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Rifa Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1, h2, h3 { color: #0d47a1; }
    .pix-area, .brinde-area {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      margin: 20px 0;
    }
    button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }
    button:hover { background: #0d47a1; transform: scale(1.02); }
    .contador {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      background: #bbdefb;
      color: #0d47a1;
      padding: 15px;
      border-radius: 50px;
      margin: 20px 0;
    }
    .numeros-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      max-height: 650px;
      overflow-y: auto;
      padding: 10px;
    }
    .numero {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
    }
    .disponivel { background: #90caf9; color: #0d47a1; }
    .ocupado { background: #1565c0; color: white; cursor: not-allowed; }
    .texto-explicativo {
      background: #e3f2fd;
      padding: 18px;
      border-radius: 20px;
      margin: 20px 0;
      word-wrap: break-word;
    }
    .botoes-acao {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .admin-link { text-align: center; margin-top: 30px; }
    .btn-admin {
      background: #0d47a1;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 40px;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }
    .btn-admin:hover { background: #1565c0; transform: scale(1.02); }
    .ganhador {
      background: gold;
      color: #0d47a1;
      text-align: center;
      padding: 20px;
      border-radius: 30px;
      margin: 20px 0;
      font-size: 22px;
      font-weight: bold;
    }
    footer { text-align: center; margin-top: 20px; font-size: 12px; color: #0d47a1; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 25px;
      max-width: 90%;
      width: 500px;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 40px;
      border: 1px solid #90caf9;
    }
    .sugestoes {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #90caf9;
      border-radius: 20px;
      margin-top: 5px;
      display: none;
    }
    .sugestao-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #e3f2fd;
    }
    .sugestao-item:hover {
      background: #e3f2fd;
    }
    .venda-item {
      background: #e3f2fd;
      border-radius: 16px;
      padding: 12px;
      margin: 10px 0;
      text-align: left;
    }
    .venda-codigo {
      font-weight: bold;
      color: #0d47a1;
    }
    .venda-data {
      font-size: 12px;
      color: #666;
    }
    .numeros-lista {
      font-weight: bold;
      color: #1565c0;
    }
    .venda-valor {
      color: #2e7d32;
      font-weight: bold;
    }
    @media (max-width: 700px) {
      .numero { width: 48px; height: 48px; font-size: 12px; }
      .contador { font-size: 18px; }
      .modal-content { width: 95%; padding: 15px; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h1 id="titulo">💙 Rifa Online</h1>
  <div class="brinde-area" id="brindeDiv"></div>
  <div class="pix-area" id="pixDiv"></div>
  <div class="contador" id="contadorDiv">⏳ Carregando...</div>
  <div class="texto-explicativo" id="textoDiv"></div>
  <div class="botoes-acao">
    <button id="meusNumerosBtn">🔍 Meus números</button>
    <button id="whatsappBtn">📱 Compartilhar</button>
  </div>
  <div id="numerosSection">
    <h3>🎟️ Números disponíveis (<span id="totalNumerosSpan"></span> disponíveis de <span id="totalConfigSpan"></span>)</h3>
    <div class="numeros-grid" id="numerosGrid"></div>
  </div>
  <div id="ganhadorSection" style="display: none;" class="ganhador"></div>
  <div class="admin-link">
    <button class="btn-admin" onclick="location.href='admin.html'">👑 Admin</button>
  </div>
  <footer>Atualiza automática • Rifa online</footer>
</div>

<!-- MODAL DE BUSCA -->
<div id="modalBusca" class="modal">
  <div class="modal-content">
    <h3>🔍 Buscar meus números</h3>
    <input type="text" id="buscaNome" placeholder="Digite parte do nome" autocomplete="off">
    <div id="sugestoes" class="sugestoes"></div>
    <div id="resultadoBusca" style="margin-top: 15px; max-height: 400px; overflow-y: auto;"></div>
    <button id="fecharBusca" style="margin-top: 10px;">Fechar</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wrofweogvhgkocevlvdf.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indyb2Z3ZW9ndmhna29jZXZsdmRmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODgwMzgxOSwiZXhwIjoyMDk0Mzc5ODE5fQ.-SJeuoVOHkuFH2UVs4GWsY0UNWYiWsSB211zKx5pmy0';
  let configAtual = null;
  let numerosAtuais = [];
  let totalNumeros = 1000;
  let todosCompradores = [];
  let valorPonto = 0;

  async function fetchAPI(endpoint) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Range-Unit': 'items', 'Range': '0-999' } });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function carregarValorPonto() {
    const data = await fetchAPI('config?id=eq.1');
    if (data && data[0]) {
      valorPonto = data[0].valor_ponto || 0;
    }
  }

  async function carregarConfig() {
    const data = await fetchAPI('config?id=eq.1');
    if (data && data[0]) {
      configAtual = data[0];
      totalNumeros = configAtual.total_numeros || 1000;
      document.getElementById('totalConfigSpan').innerText = totalNumeros;
      if (configAtual.foto_url) document.getElementById('brindeDiv').innerHTML = `<img src="${configAtual.foto_url}" style="max-width:100%; max-height:250px; border-radius:20px;">`;
      if (configAtual.chave_pix) {
        document.getElementById('pixDiv').innerHTML = `<h3>💰 Chave PIX</h3><input id="chavePixInput" value="${configAtual.chave_pix}" readonly style="width:100%; max-width:350px; padding:12px; text-align:center;"><br><button id="copiarPixBtn">Copiar chave</button>`;
        document.getElementById('copiarPixBtn')?.addEventListener('click', () => { document.getElementById('chavePixInput').select(); document.execCommand('copy'); alert('Chave PIX copiada! ✅'); });
      }
      document.getElementById('textoDiv').innerHTML = configAtual.texto_explicativo || '';
      document.getElementById('titulo').textContent = configAtual.titulo || '💙 Rifa Online';
    }
  }

  async function carregarNumeros() {
    const data = await fetchAPI('numeros?order=numero.asc');
    numerosAtuais = (data || []).filter(n => n.numero <= totalNumeros);
    const vendidos = numerosAtuais.filter(n => n.nome_comprador).length;
    const disponiveis = totalNumeros - vendidos;
    document.getElementById('totalNumerosSpan').innerText = disponiveis;
    
    const grid = document.getElementById('numerosGrid');
    grid.innerHTML = '';
    for (const num of numerosAtuais) {
      const div = document.createElement('div');
      div.className = `numero ${num.nome_comprador ? 'ocupado' : 'disponivel'}`;
      div.textContent = num.numero;
      if (num.nome_comprador) {
        div.title = `Comprador: ${num.nome_comprador}`;
        div.onclick = async () => {
          const vendaData = await fetchAPI(`vendas?order=id.desc&limit=100`);
          let codigoVenda = 'Não identificado';
          for (const v of vendaData) {
            const numsVenda = await fetchAPI(`venda_numeros?select=numero&venda_id=eq.${v.id}`);
            if (numsVenda.some(n => n.numero === num.numero)) {
              codigoVenda = v.id;
              break;
            }
          }
          alert(`Número ${num.numero}\nComprador: ${num.nome_comprador}\nCódigo da venda: #${codigoVenda}`);
        };
      }
      grid.appendChild(div);
    }
  }

  async function carregarCompradores() {
    const vendas = await fetchAPI('vendas?select=comprador');
    if (vendas && vendas.length) {
      const nomes = [...new Set(vendas.map(v => v.comprador))];
      todosCompradores = nomes.sort();
    }
  }

  async function buscarVendasPorComprador(nome) {
    const vendas = await fetchAPI(`vendas?comprador=eq.${encodeURIComponent(nome)}&order=data_venda.desc`);
    const resultadoDiv = document.getElementById('resultadoBusca');
    if (!vendas || vendas.length === 0) {
      resultadoDiv.innerHTML = '<p>❌ Nenhuma venda encontrada para este comprador.</p>';
      return;
    }
    
    let html = `<div style="text-align: left;">`;
    for (const venda of vendas) {
      const numerosVenda = await fetchAPI(`venda_numeros?select=numero&venda_id=eq.${venda.id}`);
      const listaNumeros = numerosVenda.map(n => n.numero).sort((a,b)=>a-b).join(', ');
      const valorTotal = (venda.total_numeros * valorPonto).toFixed(2).replace('.', ',');
      const dataVenda = new Date(venda.data_venda).toLocaleString();
      
      html += `
        <div class="venda-item">
          <div class="venda-codigo">🎫 Venda #${venda.id}</div>
          <div class="venda-data">📅 ${dataVenda}</div>
          <div>🔢 Números: <span class="numeros-lista">${listaNumeros}</span></div>
          <div>📦 Quantidade: ${venda.total_numeros} números</div>
          <div class="venda-valor">💰 Valor: R$ ${valorTotal}</div>
        </div>
      `;
    }
    html += `</div>`;
    resultadoDiv.innerHTML = html;
  }

  // Autocomplete
  let timeoutId = null;
  document.getElementById('buscaNome').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase();
    const sugestoesDiv = document.getElementById('sugestoes');
    
    if (timeoutId) clearTimeout(timeoutId);
    
    timeoutId = setTimeout(() => {
      if (termo.length < 2) {
        sugestoesDiv.style.display = 'none';
        sugestoesDiv.innerHTML = '';
        return;
      }
      
      const filtrados = todosCompradores.filter(nome => nome.toLowerCase().includes(termo));
      if (filtrados.length === 0) {
        sugestoesDiv.style.display = 'none';
        sugestoesDiv.innerHTML = '';
        return;
      }
      
      sugestoesDiv.innerHTML = filtrados.map(nome => `<div class="sugestao-item" data-nome="${nome}">${nome}</div>`).join('');
      sugestoesDiv.style.display = 'block';
      
      document.querySelectorAll('.sugestao-item').forEach(el => {
        el.addEventListener('click', () => {
          const nomeSelecionado = el.getAttribute('data-nome');
          document.getElementById('buscaNome').value = nomeSelecionado;
          sugestoesDiv.style.display = 'none';
          buscarVendasPorComprador(nomeSelecionado);
        });
      });
    }, 300);
  });

  function atualizarContador() {
    if (!configAtual) return;
    
    const tipoSorteio = configAtual.tipo_sorteio || 'tempo';
    const contDiv = document.getElementById('contadorDiv');
    const vendidos = numerosAtuais.filter(n => n.nome_comprador).length;
    const disponiveis = totalNumeros - vendidos;
    
    // Se já tem ganhador definido
    if (configAtual.ganhador_nome) {
      contDiv.innerHTML = `🎉 GANHADOR: ${configAtual.ganhador_nome} - Número ${configAtual.ganhador_numero} 🎉`;
      document.getElementById('numerosSection').style.display = 'none';
      document.getElementById('ganhadorSection').style.display = 'block';
      document.getElementById('ganhadorSection').innerHTML = `<h2>🏆 GANHADOR DEFINIDO 🏆</h2><div class="brinde-area"><img src="${configAtual.foto_url || ''}" style="max-width:250px"><p><strong>Brinde:</strong> ${configAtual.titulo || 'Rifa Online'}</p><p><strong>Número sorteado:</strong> ${configAtual.ganhador_numero}</p><p><strong>Ganhador:</strong> ${configAtual.ganhador_nome}</p></div>`;
      return;
    }
    
    // Se rifa encerrada sem ganhador
    if (configAtual.rifa_encerrada) {
      contDiv.innerHTML = '🔒 RIFA ENCERRADA 🔒';
      document.getElementById('numerosSection').style.display = 'none';
      document.getElementById('ganhadorSection').style.display = 'block';
      document.getElementById('ganhadorSection').innerHTML = `<h2>🔒 RIFA ENCERRADA</h2><div class="brinde-area"><img src="${configAtual.foto_url || ''}" style="max-width:200px"><p>Esta rifa foi encerrada sem ganhador definido.</p></div>`;
      return;
    }
    
    // Sorteio por pontos disponíveis
    if (tipoSorteio === 'pontos') {
      if (disponiveis === 0) {
        contDiv.innerHTML = '🎲 TODOS OS NÚMEROS FORAM VENDIDOS! Aguardando definição do ganhador... 🎲';
        document.getElementById('numerosSection').style.display = 'block';
        document.getElementById('ganhadorSection').style.display = 'none';
      } else {
        contDiv.innerHTML = `🎟️ SORTEIO AUTOMÁTICO QUANDO TODOS OS NÚMEROS FOREM VENDIDOS<br>📊 Faltam ${disponiveis} números para o sorteio!`;
        document.getElementById('numerosSection').style.display = 'block';
        document.getElementById('ganhadorSection').style.display = 'none';
      }
      return;
    }
    
    // Sorteio por tempo
    if (!configAtual.data_sorteio) {
      contDiv.innerHTML = '📅 Data do sorteio não definida';
      document.getElementById('numerosSection').style.display = 'block';
      document.getElementById('ganhadorSection').style.display = 'none';
      return;
    }
    
    const diff = new Date(configAtual.data_sorteio).getTime() - new Date().getTime();
    
    if (diff <= 0) {
      contDiv.innerHTML = '⏳ Aguardando registro do ganhador...';
      document.getElementById('numerosSection').style.display = 'none';
      document.getElementById('ganhadorSection').style.display = 'block';
      document.getElementById('ganhadorSection').innerHTML = `<h2>🎁 Sorteio realizado!</h2><div class="brinde-area"><img src="${configAtual.foto_url || ''}" style="max-width:200px"><p>Brinde: ${configAtual.titulo || 'Rifa Online'}</p><p>⏳ Aguardando o administrador definir o ganhador...</p></div>`;
    } else {
      const dias = Math.floor(diff / 86400000), horas = Math.floor((diff % 86400000) / 3600000), minutos = Math.floor((diff % 3600000) / 60000), seg = Math.floor((diff % 60000) / 1000);
      contDiv.innerHTML = `⏰ SORTEIO EM:<br>${dias}d ${horas}h ${minutos}m ${seg}s`;
      document.getElementById('numerosSection').style.display = 'block';
      document.getElementById('ganhadorSection').style.display = 'none';
    }
  }

  document.getElementById('meusNumerosBtn').onclick = async () => {
    await carregarCompradores();
    document.getElementById('buscaNome').value = '';
    document.getElementById('sugestoes').innerHTML = '';
    document.getElementById('sugestoes').style.display = 'none';
    document.getElementById('resultadoBusca').innerHTML = '';
    document.getElementById('modalBusca').style.display = 'flex';
  };
  document.getElementById('fecharBusca').onclick = () => {
    document.getElementById('modalBusca').style.display = 'none';
    document.getElementById('resultadoBusca').innerHTML = '';
    document.getElementById('buscaNome').value = '';
    document.getElementById('sugestoes').innerHTML = '';
    document.getElementById('sugestoes').style.display = 'none';
  };
  document.getElementById('whatsappBtn').onclick = () => {
    let texto = configAtual?.texto_compartilhamento || 'Participe da rifa online! 🎟️';
    texto += `\n\nLink: ${window.location.href}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  async function iniciar() {
    await carregarValorPonto();
    await carregarConfig();
    await carregarNumeros();
    atualizarContador();
    setInterval(async () => { 
      await carregarConfig(); 
      await carregarNumeros(); 
      atualizarContador(); 
    }, 5000);
  }
  iniciar();
</script>
</body>
</html>
